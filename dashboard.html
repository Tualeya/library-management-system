<!DOCTYPE html>
<html>

<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Library Dashboard</h1>

    <input type="text"
           id="titleInput"
           placeholder="Book Title">

    <input type="text"
           id="authorInput"
           placeholder="Author Name">

    <input type="text"
           id="categoryInput"
           placeholder="Category">

    <button id="addBookBtn">
        Add Book
    </button>

    <br><br>

    <input type="text"
           id="searchInput"
           placeholder="Search Book">

    <h3 id="counter">
        Total Books: 0
    </h3>

    <ul id="bookList"></ul>

    <br>

    <button id="logoutBtn">
        Logout
    </button>

</div>

<script src="script.js"></script>

</body>
</html>
