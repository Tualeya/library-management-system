<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Library Dashboard</h1>

    <div class="form-group">
        <input type="text" id="titleInput" placeholder="Book Title">
        <input type="text" id="authorInput" placeholder="Author Name">
        <input type="text" id="categoryInput" placeholder="Category">
        <button id="addBookBtn">Add Book</button>
    </div>

    <div class="search-group">
        <input type="text" id="searchInput" placeholder="Search Book">
        <h3 id="counter">Total Books: 0</h3>
    </div>

    <ul id="bookList"></ul>

    <div class="action-footer">
        <button id="logoutBtn">Logout</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
